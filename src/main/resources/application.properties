spring.application.name=drive-empresarial

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/drive_empresarial
spring.datasource.username=${DB_USER:drive_user}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-in-production-please}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
